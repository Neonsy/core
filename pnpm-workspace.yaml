packages:
  - 'packages/*'
  - 'examples'
  - 'apps/*'

# pnpm 11 blocks dependency install scripts unless listed here.
allowBuilds:
  esbuild: true
  sharp: true
  '@discordjs/opus': false
  node-webcodecs: false
  youtube-dl-exec: false

overrides:
  tar: '>=7.5.16'
  minimatch: '>=10.2.3'
  ws: '>=8.21.0'
  brace-expansion: '>=5.0.6'
  postcss: '>=8.5.10'
